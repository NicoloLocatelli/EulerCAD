line-length = 120  # Max characters per line for lint/format
target-version = "py312"  # Baseline Python version for parsing/pyupgrade
force-exclude = true  # Enforce excludes even with explicit file/dir args
src = ["src", "tests"]  # Treat these as first-party modules for import rules
respect-gitignore = true  # Also skip paths ignored by .gitignore


[lint]
preview = true
select = [
    # Ruff defaults (some pycodestyle errors, all pyflakes)
    "E4",
    "E7",
    "E9",
    "F",
    # Bandit (security rules)
    "S",
    # Eradicate (commented code)
    "ERA",
    # Async-await related
    "ASYNC",
    # Comprehensions
    "C4",
    # Executable files
    "EXE",
    # Logging and logging format
    "LOG",
    "G",
    # No prints
    "T20",
    # Return statements (e.g., superfluous else after return)
    "RET",
    # Private member access outside of class
    "SLF",
    # Simplifications
    "SIM",
    # Pathlib instead of raw os module
    "PTH",
    # McCabe complexity (limit in `tool.ruff.lint.mccabe.max-complexity`)
    "C901",
    # Numpy
    "NPY",
    # Pandas
    "PD",
    # Naming conventions
    "N",
    # Docstrings
    "DOC",
    # Various ruff-specific rules
    "RUF"
]
# Add import rules to the selected set without overwriting defaults
extend-select = [
    # Isort-like import rules
    "I",
    # Pyupgrade
    "UP"
]
ignore = [
    "N803",  # invalid-argument-name (e.g., X, Xt, ... sklearn convention)
    "N806",  # non-lowercase-variable-in-function (e.g., X, Yt, ...)
    "S101"   # no use of assert
]

# control which rules ruff may auto-fix
fixable = ["I","UP"]  # allow import sorting + pyupgrade auto-fixes
unfixable = ["F401"]  # avoid auto-removal of unused imports

[lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds max-complexity.
max-complexity = 10

[lint.pydocstyle]
convention = "google"  # Docstring style for consistent DOC rules

[lint.per-file-ignores]
"**/__init__.py" = [  # apply to all packages
    "F401"  # unused-import
]
"test*.py" = [
    "S101"  # assert
]

[format]
quote-style = "double"  # Consistent string quoting
indent-style = "space"  # Use spaces for indentation
line-ending = "lf"      # Unix line endings
docstring-code-format = true  # Format code blocks inside docstrings
docstring-code-line-length = 120  # Wrap length for docstring code blocks
